name: Build site

# Builds the static HotMakes site and saves the finished files to the "built-site" branch
# so they can be previewed. This does NOT publish anything to hotmakes.com.
on:
  push:
    branches-ignore: [data, built-site]
    paths: ['site/**', '.github/workflows/build-site.yml']
  workflow_dispatch:

concurrency:
  group: build-site-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Save the finished files to the built-site branch
        working-directory: site/dist
        run: |
          touch .nojekyll
          git init -q -b built-site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Built from ${{ github.sha }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" built-site
