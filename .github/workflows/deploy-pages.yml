name: Publish site

# Builds the HotMakes site and, only when you ask, publishes it to GitHub Pages.
# Run it by hand from the Actions tab. Leave "publish" unticked to just test the build.
# Nothing here runs automatically, and it never touches DNS or the domain.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to GitHub Pages? (leave off to only test the build)'
        type: boolean
        default: false

concurrency:
  group: publish-site
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Add the files Pages needs
        run: |
          touch dist/.nojekyll
          cp dist/index.html dist/404.html

      - name: Package the finished site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  publish:
    if: ${{ inputs.publish }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
